name: Metasploit

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  msf:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Pull Metasploit image
        run: docker pull metasploitframework/metasploit-framework:latest

      - name: Run msfconsole (version check)
        run: |
          docker run --rm metasploitframework/metasploit-framework:latest \
            ./msfconsole -q -x "version; exit"

      - name: Run a resource script from the repo
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            metasploitframework/metasploit-framework:latest \
            ./msfconsole -q -r /work/scan.rc
